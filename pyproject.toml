[project]
name = "tonetool"
version = "0.1.0"
description = "Choir practice tool: import MusicXML, manage sections/repeats, serve pieces to a web player"
authors = [
    { name = "sikamber", email = "simonkamber@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "lxml>=6.1.3",
    "music21>=10.5.2",
    "pydantic>=2.14.4",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
tonetool = "tonetool.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests", "scripts"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "lxml-stubs>=0.5.1",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
]
