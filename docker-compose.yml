# Tonetool behind Caddy. Copy .env.example to .env, fill it in, then: docker compose up -d --build
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      TONETOOL_USERNAME: ${TONETOOL_USERNAME:?set TONETOOL_USERNAME in .env}
      TONETOOL_PASSWORD_HASH: ${TONETOOL_PASSWORD_HASH:?set TONETOOL_PASSWORD_HASH in .env}
      TONETOOL_SECRET: ${TONETOOL_SECRET:?set TONETOOL_SECRET in .env}
    volumes:
      - tonetool-data:/data
    # no "ports:": only Caddy, on the compose network, may reach the app
    expose:
      - "8000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${TONETOOL_HTTP_PORT:-80}:80"
      - "${TONETOOL_HTTPS_PORT:-443}:443"
    environment:
      TONETOOL_DOMAIN: ${TONETOOL_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  tonetool-data:
  caddy-data:
  caddy-config:
