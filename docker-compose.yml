# Tonetool behind Caddy, using the image published to ghcr.io by .github/workflows/image.yml.
# Copy .env.example to .env, fill it in, then: docker compose pull && docker compose up -d
# To build from a checkout instead: docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
services:
  app:
    image: ghcr.io/sikamber/tonetool:${TONETOOL_TAG:-latest}
    restart: unless-stopped
    environment:
      TONETOOL_USERNAME: ${TONETOOL_USERNAME:?set TONETOOL_USERNAME in .env}
      TONETOOL_PASSWORD_HASH: ${TONETOOL_PASSWORD_HASH:?set TONETOOL_PASSWORD_HASH in .env}
      TONETOOL_SECRET: ${TONETOOL_SECRET:?set TONETOOL_SECRET in .env}
    volumes:
      - tonetool-data:/data
    # no "ports:": only Caddy, on the compose network, may reach the app
    expose:
      - "8000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${TONETOOL_HTTP_PORT:-80}:80"
      - "${TONETOOL_HTTPS_PORT:-443}:443"
    environment:
      TONETOOL_DOMAIN: ${TONETOOL_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  tonetool-data:
  caddy-data:
  caddy-config:
